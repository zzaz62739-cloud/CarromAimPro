plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.carrom.rebuild'
    compileSdk 35
    defaultConfig {
        applicationId 'com.carrom.rebuild'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -Wall -Wextra -Werror' }
        }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt') }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
