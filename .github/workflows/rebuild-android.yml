name: Build fresh Android capture base
on:
  push:
    branches: [kala-reference-rebuild]
    paths:
      - 'rebuild/android/**'
      - '.github/workflows/rebuild-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle -p rebuild/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: carrom-rebuild-capture-base
          path: rebuild/android/app/build/outputs/apk/debug/app-debug.apk
