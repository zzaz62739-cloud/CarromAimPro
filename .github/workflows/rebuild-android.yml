name: Build fresh Android capture base
on:
  push:
    branches: [kala-reference-rebuild]
    paths:
      - 'rebuild/android/**'
      - 'rebuild/native/**'
      - '.github/workflows/rebuild-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android SDK, NDK and CMake
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle -p rebuild/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: carrom-rebuild-capture-base
          path: rebuild/android/app/build/outputs/apk/debug/app-debug.apk
