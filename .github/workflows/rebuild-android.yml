name: Build fresh Android capture base
on:
  push:
    branches: [kala-reference-rebuild]
    paths:
      - 'rebuild/android/**'
      - 'rebuild/native/**'
      - '.github/workflows/rebuild-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p rebuild/android assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -s rebuild/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: carrom-rebuild-capture-base
          path: rebuild/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
