name: Inspect CarromAimPro source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and print Android project configuration
        run: |
          unzip -o CarromAimPro_GitHub.zip -d project
          echo '===== APP BUILD GRADLE ====='
          cat project/app/build.gradle
          echo '===== ANDROID MANIFEST ====='
          cat project/app/src/main/AndroidManifest.xml
          echo '===== MAIN ACTIVITY ====='
          cat project/app/src/main/java/com/carromaimpro/MainActivity.kt
